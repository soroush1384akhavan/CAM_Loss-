seed: 42

# Linux server paths
# data_dir: "/media/vision/ShareStorage-2/soroush/CVLab/cars_dataset/cars_dataset"
# mask_root: "/media/vision/ShareStorage-2/soroush/CVLab/masks/sam_pseudo_masks_cars"

# Windows paths
data_dir: "D:/CVLab/temp/SAM/cars_dataset"
mask_root: "D:/CVLab/temp/SAM/sam_pseudo_masks_cars"

# pets Dataset paths
# mask_root: "D:/CVLab/temp/SAM/sam_pseudo_masks_pets"
# data_dir: "D:/CVLab/temp/SAM/organized_pets/dataset"


image_size: 224
# RGB pixels are divided by 255 first. These values apply to every split,
# CAM image reconstruction, and pixel-space attacks. BiT expects [-1, 1].
normalize_mean: [0.5, 0.5, 0.5]
normalize_std: [0.5, 0.5, 0.5]
batch_size: 8
val_ratio: 0.2
test_ratio: 0.1
num_workers: 0

model_type: "adapter_bit"
pretrained: true
bit_weights_path: "weights/model.safetensors"
adapter_gamma: 8
adapter_kernel_size: 3
freeze_backbone: true

epochs: 50
learning_rate: 0.0003
weight_decay: 0.0001
scheduler: "cosine"
eta_min: 0.000001
use_amp: true

early_stopping: true
early_stopping_monitor: "val_loss"
early_stopping_patience: 8
early_stopping_min_delta: 0.0001

# loss = classification_loss + lambda_cam * cam_loss
lambda_cam: 0.5
lambda_cam_start: 0.0
lambda_cam_warmup_epochs: 10
lambda_cam_warmup_power: 2.0
cam_loss_type: "allclass_squared_containment"
cam_softmax_temperature: 1.0
outside_weight: 1.0
inside_weight: 1.0

# Set only one of these two options.
train_shots_per_class: 16
train_fraction: null

diagnostics: true
mask_audit: true
mask_audit_max_decoded: 600
mask_audit_examples: 12
cam_stats: true
grad_probe: true
grad_probe_batches: 3
cam_snapshots: true
cam_snapshots_count: 8
cam_snapshots_every: 1
cam_debug: true
cam_debug_top_k: 20

runs_dir: "runs/bitm_r50x1_adapter_g8_16shot_cam005"

mask_dirs:
  cat: "sam_pseudo_masks_cat/masks"
  dog: "sam_pseudo_masks_dog/masks"

mask_manifests:
  cat: "sam_pseudo_masks_cat/manifest_cat_masks.csv"
  dog: "sam_pseudo_masks_dog/manifest_dog_masks.csv"
